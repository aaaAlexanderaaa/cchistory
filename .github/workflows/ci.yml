name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Documentation and architecture governance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify governance harness
        run: pnpm run verify:governance

  build-and-test:
    name: Full profile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Full profile
        run: pnpm run build:full

      - name: Test Full profile
        run: pnpm run test:full

      - name: Verify support status
        run: pnpm run verify:support-status

      - name: Verify runtime inventory
        run: pnpm run verify:runtime-inventory

      - name: Verify product profiles
        run: pnpm run verify:product-profiles

  lite:
    name: Lite profile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test Lite profile
        run: pnpm run verify:lite
      - name: Verify standalone Lite artifact
        run: pnpm run verify:lite-artifact -- --skip-build

  managed:
    name: Managed Web/API profile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Managed profile
        run: pnpm run build:managed
      - name: Test Managed profile
        run: pnpm run test:managed

  agent-extension:
    name: Agent extension profile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test Agent extension profile
        run: pnpm run test:agent-extension
